name: Discover PC releases

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch IGDB PC release dates
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python tools/discover_releases.py
      - name: Commit updated dataset
        run: |
          git config user.name "hirrdirr-discover-bot"
          git config user.email "hirrdirr-discover-bot@users.noreply.github.com"
          git add assets/data/discover/releases.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh IGDB PC releases"
          git push
