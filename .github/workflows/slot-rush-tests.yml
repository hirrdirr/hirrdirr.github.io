name: Slot Rush checks
on:
  pull_request:
    paths: ['games/slot-rush/**', '.github/workflows/slot-rush-tests.yml']
  push:
    branches: [main]
    paths: ['games/slot-rush/**', '.github/workflows/slot-rush-tests.yml']
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test games/slot-rush/tests/*.test.mjs
      - run: node --check games/slot-rush/scenery.js
      - run: node --check games/slot-rush/audio.js
